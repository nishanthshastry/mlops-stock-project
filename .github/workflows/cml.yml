name: Research Report Generation

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  train-report:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: src

      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install CML
        run: |
          npm install -g @dvcorg/cml

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-python-3.11-${{ hashFiles('requirements.txt') }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "dvc[s3]"
          pip install -r requirements.txt

      - name: Pull DVC Data
        run: |
          dvc pull

      - name: Create Report Directories
        run: |
          mkdir -p reports/figures
          mkdir -p reports/monitoring

      - name: Run CI Validation
        run: |
          make ci

      - name: Run Full ML Pipeline
        run: |
          make full-rebuild
          make all

      - name: Run Monitoring
        run: |
          make full-monitoring

      - name: Run Simulations
        run: |
          make simulate-baseline
          make simulate-retraining
          make simulate-drift

      - name: Generate Research Report
        run: |
          echo "# MLOps Stock Prediction Research Report" > report.md
          echo "" >> report.md

          echo "## Research Topic" >> report.md
          echo "Evaluating Model Drift and Retraining Strategies in an MLOps Pipeline for Stock Market Prediction" >> report.md
          echo "" >> report.md

          echo "## Pipeline Status" >> report.md
          echo "[x] Data Pipeline Completed" >> report.md
          echo "[x] Feature Engineering Completed" >> report.md
          echo "[x] Model Training Completed" >> report.md
          echo "[x] Explainability Analysis Completed" >> report.md
          echo "[x] Backtesting Completed" >> report.md
          echo "[x] Regime Analysis Completed" >> report.md
          echo "[x] Drift Detection Completed" >> report.md
          echo "[x] Automated Retraining Completed" >> report.md
          echo "[x] Simulations Completed" >> report.md
          echo "" >> report.md

          echo "## Platform Components" >> report.md
          echo "- FastAPI Inference API" >> report.md
          echo "- Docker Deployment" >> report.md
          echo "- MLflow Experiment Tracking" >> report.md
          echo "- DVC Dataset & Model Versioning" >> report.md
          echo "- Drift Monitoring" >> report.md
          echo "- Automated Retraining" >> report.md
          echo "- SHAP Explainability" >> report.md
          echo "- Strategy Backtesting" >> report.md
          echo "" >> report.md

          echo "## Model Comparison" >> report.md
          echo "" >> report.md

          if [ -f reports/figures/LogisticRegression_cm.png ]; then
            echo "### Logistic Regression" >> report.md
            echo "![](reports/figures/LogisticRegression_cm.png)" >> report.md
            echo "" >> report.md
          fi

          if [ -f reports/figures/RandomForest_cm.png ]; then
            echo "### Random Forest" >> report.md
            echo "![](reports/figures/RandomForest_cm.png)" >> report.md
            echo "" >> report.md
          fi

          if [ -f reports/figures/ExtraTrees_cm.png ]; then
            echo "### Extra Trees" >> report.md
            echo "![](reports/figures/ExtraTrees_cm.png)" >> report.md
            echo "" >> report.md
          fi

          if [ -f reports/figures/XGBoost_cm.png ]; then
            echo "### XGBoost (Selected Model)" >> report.md
            echo "![](reports/figures/XGBoost_cm.png)" >> report.md
            echo "" >> report.md
          fi

          echo "## SHAP Explainability" >> report.md
          echo "" >> report.md

          if [ -f reports/figures/shap_summary.png ]; then
            echo "![](reports/figures/shap_summary.png)" >> report.md
            echo "" >> report.md
          fi

          if [ -f reports/figures/shap_bar.png ]; then
            echo "![](reports/figures/shap_bar.png)" >> report.md
            echo "" >> report.md
          fi

          echo "## Backtesting Results" >> report.md
          echo "" >> report.md

          if [ -f reports/figures/strategy_vs_market.png ]; then
            echo "![](reports/figures/strategy_vs_market.png)" >> report.md
            echo "" >> report.md
          fi

          echo "## Regime Analysis" >> report.md
          echo "" >> report.md

          if [ -f reports/figures/regime_f1_scores.png ]; then
            echo "![](reports/figures/regime_f1_scores.png)" >> report.md
            echo "" >> report.md
          fi

          echo "## Retraining Strategy Evaluation" >> report.md
          echo "" >> report.md

          if [ -f reports/figures/baseline_performance.png ]; then
            echo "### Baseline Model" >> report.md
            echo "![](reports/figures/baseline_performance.png)" >> report.md
            echo "" >> report.md
          fi

          if [ -f reports/figures/scheduled_retraining_performance.png ]; then
            echo "### Scheduled Retraining" >> report.md
            echo "![](reports/figures/scheduled_retraining_performance.png)" >> report.md
            echo "" >> report.md
          fi

          if [ -f reports/figures/drift_retraining_performance.png ]; then
            echo "### Drift-Triggered Retraining" >> report.md
            echo "![](reports/figures/drift_retraining_performance.png)" >> report.md
            echo "" >> report.md
          fi

          echo "## MLflow" >> report.md
          echo "" >> report.md
          mlflow --version >> report.md
          echo "" >> report.md

          echo "## Docker" >> report.md
          echo "- DockerHub Repository: nshastry00/mlops-stock-api" >> report.md
          echo "" >> report.md

      - name: Publish PR Comment
        if: github.event_name == 'pull_request'
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cml comment create --publish report.md

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: research-report-artifacts
          path: |
            report.md
            reports/figures
            reports/monitoring