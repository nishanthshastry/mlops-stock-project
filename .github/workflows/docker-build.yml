name: Docker Build

on:
  push:
    branches:
      - main
      - dev

    tags:
      - "v*"

  pull_request:
    branches:
      - main
      - dev

  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: nshastry00/mlops-stock-api
          tags: |
            type=raw,value=latest
            type=sha
            type=ref,event=branch

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfiles/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Docker Images
        run: |
          docker images

      - name: Test Container Startup
        run: |
          docker run -d -p 8000:8000 --name mlops-test nshastry00/mlops-stock-api:latest

          sleep 15

          docker ps

          docker logs mlops-test

      - name: Docker Workflow Completed
        run: |
          echo "Docker build pipeline completed successfully."