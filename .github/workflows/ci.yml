name: MLOps CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - dev

  pull_request:
    branches:
      - main
      - master
      - dev

jobs:
  test:

    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install "dvc[s3]"

    - name: Pull DVC Artifacts
      run: |
        dvc pull

    - name: Set PYTHONPATH
      run: echo "PYTHONPATH=src" >> $GITHUB_ENV

    - name: Verify Imports
      run: |
        python -c "from mlops_stock_project.api.app import app"
        python -c "from mlops_stock_project.models.train_model import train_model"

    - name: Run Ruff
      run: |
        ruff check .

    - name: Run Black Check
      run: |
        black --check .

    - name: Run Tests
      run: |
        pytest

    - name: Build Docker Image
      run: |
        docker build -t mlops-stock-api -f dockerfiles/Dockerfile .