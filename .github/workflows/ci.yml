name: CI

on:
  push:
    branches:
      - main
      - master
      - dev

  pull_request:
    branches:
      - main
      - master
      - dev

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11"]

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      PYTHONPATH: src

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-python-${{ matrix.python-version }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-python-${{ matrix.python-version }}-pip-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "dvc[s3]"
          pip install -r requirements.txt

      - name: Verify DVC Installation
        run: |
          dvc version

      - name: Pull DVC Data
        run: |
          dvc pull

      - name: Verify Imports
        run: |
          python -c "from mlops_stock_project.api.app import app"
          python -c "from mlops_stock_project.models.train_model import train_model"
          python -c "from mlops_stock_project.monitoring.drift import detect_drift"

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Format Check with Black
        run: |
          black --check .

      - name: Run Tests with pytest
        run: |
          pytest -v

      - name: Build Docker Image
        run: |
          docker build \
            -t mlops-stock-api \
            -f dockerfiles/Dockerfile .

      - name: Verify Docker Image
        run: |
          docker images

      - name: CI Pipeline Completed
        run: |
          echo "MLOps CI Pipeline completed successfully."
