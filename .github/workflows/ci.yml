name: MLOps CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - dev

  pull_request:
    branches:
      - main
      - master
      - dev

jobs:
  test:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Set PYTHONPATH
      run: echo "PYTHONPATH=src" >> $GITHUB_ENV

    - name: Verify Imports
      run: |
        python -c "from mlops_stock_project.api.app import app"
        python -c "from mlops_stock_project.models.train_model import train_model"

    - name: Build Docker Image
      run: |
        docker build -t mlops-stock-api -f dockerfiles/Dockerfile .