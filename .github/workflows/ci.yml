name: CI

on:
  push:
    branches:
      - main
      - master
      - dev

  pull_request:
    branches:
      - main
      - master
      - dev

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11"]

    env:
      PYTHONPATH: src

      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}

      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-python-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "dvc[s3]"
          pip install -r requirements.txt

      - name: Verify DVC
        run: |
          dvc version

      - name: Pull DVC Data
        run: |
          dvc pull

      - name: Verify Critical Imports
        run: |
          python -c "from mlops_stock_project.api.app import app"
          python -c "from mlops_stock_project.models.train_model import train_and_track_models"
          python -c "from mlops_stock_project.monitoring.drift import detect_drift"
          python -c "from mlops_stock_project.features.feature_pipeline import prepare_features"

      - name: Run CI Checks
        run: |
          make ci

      - name: Verify Simulations
        run: |
          python -m mlops_stock_project.models.simulate_baseline
          python -m mlops_stock_project.models.simulate_retraining
          python -m mlops_stock_project.models.simulate_drift_retraining

      - name: Build Docker Image
        run: |
          docker build \
            -t mlops-stock-api \
            -f dockerfiles/Dockerfile .

      - name: Verify Docker Image
        run: |
          docker images

      - name: CI Completed
        run: |
          echo "CI pipeline completed successfully."